name: Deploy Laravel to CapRover

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cribsearch:latest
            ${{ secrets.DOCKER_USERNAME }}/cribsearch:${{ github.sha }}

      - name: Trigger CapRover Deployment
        run: |
          npm install -g caprover
          caprover deploy \
            -h "${{ secrets.CAPROVER_SERVER }}" \
            -p "${{ secrets.CAPROVER_PASSWORD }}" \
            -a "${{ secrets.APP_NAME }}" \
            -i "${{ secrets.DOCKER_USERNAME }}/cribsearch:${{ github.sha }}"